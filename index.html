<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vortex ROV - Task Manager</title>
  <link rel="manifest" href="/Vortex-Rov/manifest.json" />
  <meta name="theme-color" content="#0b192c" />
  <style>
    :root {
      --bg: #0b192c;
      --card: #13263f;
      --accent: #00b4d8;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --border: #1e3a5f;
      --danger: #ef4444;
      --ok: #22c55e;
    }
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 16px;
    }
    .container { max-width: 900px; margin: 0 auto; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 14px;
    }
    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .stack { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
    input, select, button {
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
    }
    button {
      background: var(--accent);
      color: #04101d;
      font-weight: 700;
      border: none;
      cursor: pointer;
    }
    button:disabled { opacity: 0.55; cursor: not-allowed; }
    button.secondary { background: #1e3a5f; color: var(--text); }
    button.danger { background: var(--danger); color: #fff; }
    .task {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      margin-top: 10px;
      background: rgba(11, 25, 44, 0.65);
    }
    .badge {
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 12px;
      background: #1e3a5f;
      color: #e2e8f0;
    }
    .divider {
      height: 1px;
      background: var(--border);
      margin: 12px 0;
    }
    .hint {
      font-size: 12px;
      color: var(--muted);
    }
    .hidden { display: none; }
    #statusMsg { font-size: 13px; color: var(--muted); margin-top: 8px; }
  </style>
</head>
<body>
  <div class="container">
    <!-- بطاقة الحساب وتسجيل الدخول -->
    <div class="card">
      <h2 style="margin:0 0 8px 0;">Vortex ROV — إدارة المهام</h2>
      <div id="statusMsg">جاري تهيئة النظام...</div>

      <div id="authBox" style="margin-top:12px;">
        <div class="row">
          <button id="loginGoogleBtn" type="button">تسجيل الدخول بحساب Google</button>
          <button id="logoutBtn" type="button" class="secondary hidden">تسجيل الخروج</button>
          <span id="userInfo" class="badge hidden"></span>
        </div>

        <div id="authMethodsSection" class="stack">
          <!-- البريد الإلكتروني وكلمة المرور -->
          <div class="divider"></div>
          <div class="hint">تسجيل الدخول أو إنشاء حساب بالبريد الإلكتروني وكلمة المرور:</div>
          <div class="row">
            <input id="emailInput" type="email" dir="ltr" placeholder="name@example.com" style="flex:1; min-width:190px;" />
            <input id="passwordInput" type="password" dir="ltr" placeholder="كلمة المرور (6 أحرف فأكثر)" style="flex:1; min-width:190px;" />
          </div>
          <div class="row">
            <button id="emailSignInBtn" type="button">دخول بالبريد</button>
            <button id="emailSignUpBtn" type="button" class="secondary">إنشاء حساب جديد</button>
          </div>

          <!-- رقم التليفون -->
          <div class="divider"></div>
          <div class="hint">تسجيل الدخول برقم التليفون (مثال: +201012345678):</div>
          <div class="row">
            <input id="phoneInput" type="tel" dir="ltr" placeholder="+201xxxxxxxxx" style="flex:1; min-width:190px;" />
            <button id="sendOtpBtn" type="button" class="secondary">إرسال كود التحقق</button>
          </div>
          <div id="otpRow" class="row hidden">
            <input id="otpInput" type="text" dir="ltr" inputmode="numeric" placeholder="أدخل كود التحقق (6 أرقام)" style="flex:1; min-width:190px;" />
            <button id="verifyOtpBtn" type="button">تأكيد الدخول</button>
          </div>
          <div id="recaptcha-container"></div>
        </div>
      </div>
    </div>

    <!-- إدارة المشرفين للمالك -->
    <div id="adminBox" class="card hidden">
      <h3 style="margin:0 0 10px 0;">إدارة المشرفين (Owner)</h3>
      <div class="row">
        <input id="adminEmailInput" type="email" placeholder="البريد الإلكتروني للمشرف" />
        <button id="addAdminBtn" type="button">إضافة Admin</button>
        <button id="removeAdminBtn" type="button" class="danger">إزالة Admin</button>
      </div>
    </div>

    <!-- قسم المهام -->
    <div id="appBox" class="card hidden">
      <h3 style="margin:0 0 10px 0;">المهام</h3>
      <div class="row">
        <input id="taskTitleInput" type="text" placeholder="عنوان المهمة الجديدة..." style="flex:1; min-width:200px;" />
        <select id="taskStatusSelect">
          <option value="pending">قيد التنفيذ</option>
          <option value="done">مكتملة</option>
        </select>
        <button id="addTaskBtn" type="button">إضافة مهمة</button>
      </div>

      <div class="row" style="margin-top:12px;">
        <label for="filterSelect">تصفية:</label>
        <select id="filterSelect">
          <option value="all">الكل</option>
          <option value="pending">قيد التنفيذ</option>
          <option value="done">مكتملة</option>
        </select>
      </div>

      <div id="tasksList"></div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getAuth,
      GoogleAuthProvider,
      signInWithEmailAndPassword,
      createUserWithEmailAndPassword,
      RecaptchaVerifier,
      signInWithPhoneNumber,
      signInWithPopup,
      signInWithRedirect,
      getRedirectResult,
      signOut,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import {
      getFirestore,
      collection,
      addDoc,
      updateDoc,
      deleteDoc,
      doc,
      setDoc,
      onSnapshot,
      query,
      orderBy,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    // استبدل هذه القيم ببيانات مشروعك الحقيقية من Firebase Console
    const OWNER_EMAIL = "OWNER_EMAIL_HERE";

    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "vortex-rov.firebaseapp.com",
      projectId: "vortex-rov",
      storageBucket: "vortex-rov.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    const statusMsg = document.getElementById("statusMsg");
    const loginGoogleBtn = document.getElementById("loginGoogleBtn");
    const logoutBtn = document.getElementById("logoutBtn");
    const authMethodsSection = document.getElementById("authMethodsSection");
    const emailInput = document.getElementById("emailInput");
    const passwordInput = document.getElementById("passwordInput");
    const emailSignInBtn = document.getElementById("emailSignInBtn");
    const emailSignUpBtn = document.getElementById("emailSignUpBtn");
    const phoneInput = document.getElementById("phoneInput");
    const sendOtpBtn = document.getElementById("sendOtpBtn");
    const otpRow = document.getElementById("otpRow");
    const otpInput = document.getElementById("otpInput");
    const verifyOtpBtn = document.getElementById("verifyOtpBtn");
    const userInfo = document.getElementById("userInfo");
    const adminBox = document.getElementById("adminBox");
    const appBox = document.getElementById("appBox");
    const tasksList = document.getElementById("tasksList");
    const filterSelect = document.getElementById("filterSelect");

    function setStatus(text) {
      statusMsg.textContent = text;
    }

    function formatError(err, fallback = "حدث خطأ غير متوقع") {
      if (!err) return fallback;
      return `${fallback} (${err.code || err.message || "error"})`;
    }

    function isIOS() {
      return /iPad|iPhone|iPod/i.test(navigator.userAgent);
    }

    function normalizePhone(raw) {
      const cleaned = raw.trim().replace(/\s+/g, "");
      if (!cleaned) return "";
      if (cleaned.startsWith("+")) return cleaned;
      if (/^0?1\d{9}$/.test(cleaned)) {
        return "+2" + cleaned.replace(/^0/, "0");
      }
      return "+" + cleaned;
    }

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker
          .register("/Vortex-Rov/service-worker.js")
          .catch((err) => console.warn("ServiceWorker note:", err));
      });
    }

    let auth = null;
    let db = null;
    let provider = null;
    let confirmationResult = null;
    let recaptchaVerifier = null;

    try {
      const app = initializeApp(firebaseConfig);
      auth = getAuth(app);
      db = getFirestore(app);
      provider = new GoogleAuthProvider();
      provider.setCustomParameters({ prompt: "select_account" });
    } catch (err) {
      setStatus(formatError(err, "تحقق من إعدادات Firebase داخل index.html"));
      console.error(err);
    }

    function ensureRecaptcha() {
      if (!auth || recaptchaVerifier) return recaptchaVerifier;
      recaptchaVerifier = new RecaptchaVerifier(auth, "recaptcha-container", {
        size: "invisible"
      });
      return recaptchaVerifier;
    }

    let currentUser = null;
    let currentRole = "Member";
    let adminEmails = new Set();
    let allTasks = [];
    let unsubscribeTasks = null;
    let unsubscribeAdmins = null;

    function computeRole(user) {
      if (!user) return "Member";
      const email = (user.email || "").toLowerCase();
      if (email && OWNER_EMAIL !== "OWNER_EMAIL_HERE" && email === OWNER_EMAIL.toLowerCase()) {
        return "Owner";
      }
      if (email && adminEmails.has(email)) {
        return "Admin";
      }
      return "Member";
    }

    function renderUI() {
      if (!currentUser) {
        loginGoogleBtn.classList.remove("hidden");
        authMethodsSection.classList.remove("hidden");
        logoutBtn.classList.add("hidden");
        userInfo.classList.add("hidden");
        adminBox.classList.add("hidden");
        appBox.classList.add("hidden");
        setStatus("سجّل الدخول بحساب Google أو البريد الإلكتروني أو رقم التليفون.");
        return;
      }

      currentRole = computeRole(currentUser);
      const identityLabel = currentUser.email || currentUser.phoneNumber || currentUser.uid;

      loginGoogleBtn.classList.add("hidden");
      authMethodsSection.classList.add("hidden");
      otpRow.classList.add("hidden");
      logoutBtn.classList.remove("hidden");
      userInfo.classList.remove("hidden");
      userInfo.textContent = `${identityLabel} (${currentRole})`;
      appBox.classList.remove("hidden");
      adminBox.classList.toggle("hidden", currentRole !== "Owner");
      setStatus(`تم تسجيل الدخول بنجاح — الصلاحية: ${currentRole}`);
      renderTasks();
    }

    function canManageTask(task) {
      if (!currentUser) return false;
      if (currentRole === "Owner" || currentRole === "Admin") return true;
      return task.createdByUid === currentUser.uid;
    }

    function renderTasks() {
      const filter = filterSelect.value;
      const filtered = allTasks.filter((t) => filter === "all" || t.status === filter);
      tasksList.innerHTML = "";

      if (filtered.length === 0) {
        tasksList.innerHTML = `<p style="color:var(--muted); margin-top:12px;">لا توجد مهام مطابقة.</p>`;
        return;
      }

      filtered.forEach((task) => {
        const div = document.createElement("div");
        div.className = "task";

        const left = document.createElement("div");
        const titleEl = document.createElement("div");
        titleEl.textContent = task.title || "بدون عنوان";
        titleEl.style.fontWeight = "600";

        const metaEl = document.createElement("div");
        metaEl.style.fontSize = "12px";
        metaEl.style.color = "var(--muted)";
        metaEl.textContent = `الحالة: ${task.status === "done" ? "مكتملة" : "قيد التنفيذ"} — بواسطة: ${task.createdByLabel || "عضو"}`;

        left.appendChild(titleEl);
        left.appendChild(metaEl);

        const actions = document.createElement("div");
        actions.className = "row";

        if (canManageTask(task)) {
          const toggleBtn = document.createElement("button");
          toggleBtn.type = "button";
          toggleBtn.className = "secondary";
          toggleBtn.textContent = task.status === "done" ? "إعادة فتح" : "إتمام";
          toggleBtn.addEventListener("click", async () => {
            try {
              await updateDoc(doc(db, "tasks", task.id), {
                status: task.status === "done" ? "pending" : "done"
              });
            } catch (err) {
              setStatus(formatError(err, "تعذر تحديث حالة المهمة"));
            }
          });

          const delBtn = document.createElement("button");
          delBtn.type = "button";
          delBtn.className = "danger";
          delBtn.textContent = "حذف";
          delBtn.addEventListener("click", async () => {
            try {
              await deleteDoc(doc(db, "tasks", task.id));
            } catch (err) {
              setStatus(formatError(err, "تعذر حذف المهمة"));
            }
          });

          actions.appendChild(toggleBtn);
          actions.appendChild(delBtn);
        }

        div.appendChild(left);
        div.appendChild(actions);
        tasksList.appendChild(div);
      });
    }

    if (auth) {
      getRedirectResult(auth).catch((err) => {
        setStatus(formatError(err, "حدث خطأ أثناء إتمام تسجيل الدخول"));
      });
    }

    loginGoogleBtn.addEventListener("click", async () => {
      if (!auth || !provider) {
        setStatus("Firebase غير مهيأ — راجع firebaseConfig.");
        return;
      }
      setStatus("جاري فتح تسجيل الدخول بحساب Google...");
      try {
        if (isIOS()) {
          await signInWithRedirect(auth, provider);
          return;
        }
        await signInWithPopup(auth, provider);
      } catch (err) {
        const code = err && err.code ? err.code : "";
        if (
          code === "auth/popup-blocked" ||
          code === "auth/operation-not-supported-in-this-environment" ||
          code === "auth/cancelled-popup-request"
        ) {
          try {
            await signInWithRedirect(auth, provider);
            return;
          } catch (redirErr) {
            setStatus(formatError(redirErr, "حدث خطأ أثناء تسجيل الدخول"));
            return;
          }
        }
        setStatus(formatError(err, "حدث خطأ أثناء تسجيل الدخول"));
      }
    });

    emailSignInBtn.addEventListener("click", async () => {
      if (!auth) return;
      const email = emailInput.value.trim();
      const password = passwordInput.value;
      if (!email || !password) {
        setStatus("أدخل البريد الإلكتروني وكلمة المرور.");
        return;
      }
      emailSignInBtn.disabled = true;
      setStatus("جاري تسجيل الدخول بالبريد الإلكتروني...");
      try {
        await signInWithEmailAndPassword(auth, email, password);
      } catch (err) {
        setStatus(formatError(err, "تعذر تسجيل الدخول بالبريد"));
      } finally {
        emailSignInBtn.disabled = false;
      }
    });

    emailSignUpBtn.addEventListener("click", async () => {
      if (!auth) return;
      const email = emailInput.value.trim();
      const password = passwordInput.value;
      if (!email || !password) {
        setStatus("أدخل البريد الإلكتروني وكلمة المرور لإنشاء الحساب.");
        return;
      }
      emailSignUpBtn.disabled = true;
      setStatus("جاري إنشاء الحساب...");
      try {
        await createUserWithEmailAndPassword(auth, email, password);
      } catch (err) {
        setStatus(formatError(err, "تعذر إنشاء الحساب"));
      } finally {
        emailSignUpBtn.disabled = false;
      }
    });

    sendOtpBtn.addEventListener("click", async () => {
      if (!auth) {
        setStatus("Firebase غير مهيأ — راجع firebaseConfig.");
        return;
      }
      const phoneNumber = normalizePhone(phoneInput.value);
      if (!/^\+\d{8,15}$/.test(phoneNumber)) {
        setStatus("اكتب رقم تليفون صحيح بصيغة دولية مثل +201012345678.");
        return;
      }

      sendOtpBtn.disabled = true;
      setStatus("جاري إرسال كود التحقق...");
      try {
        const verifier = ensureRecaptcha();
        confirmationResult = await signInWithPhoneNumber(auth, phoneNumber, verifier);
        otpRow.classList.remove("hidden");
        setStatus(`تم إرسال كود التحقق إلى ${phoneNumber}.`);
      } catch (err) {
        setStatus(formatError(err, "تعذر إرسال كود التحقق"));
        if (recaptchaVerifier) {
          try { recaptchaVerifier.clear(); } catch (_) {}
          recaptchaVerifier = null;
        }
      } finally {
        sendOtpBtn.disabled = false;
      }
    });

    verifyOtpBtn.addEventListener("click", async () => {
      const code = otpInput.value.trim();
      if (!confirmationResult || !code) {
        setStatus("أدخل كود التحقق أولاً.");
        return;
      }
      verifyOtpBtn.disabled = true;
      setStatus("جاري التحقق من الكود...");
      try {
        await confirmationResult.confirm(code);
        otpInput.value = "";
        phoneInput.value = "";
        confirmationResult = null;
      } catch (err) {
        setStatus(formatError(err, "كود التحقق غير صحيح أو منتهي"));
      } finally {
        verifyOtpBtn.disabled = false;
      }
    });

    logoutBtn.addEventListener("click", async () => {
      try {
        await signOut(auth);
      } catch (err) {
        setStatus(formatError(err, "حدث خطأ أثناء تسجيل الخروج"));
      }
    });

    document.getElementById("addTaskBtn").addEventListener("click", async () => {
      const input = document.getElementById("taskTitleInput");
      const statusSel = document.getElementById("taskStatusSelect");
      const title = input.value.trim();
      if (!title || !currentUser) return;

      try {
        await addDoc(collection(db, "tasks"), {
          title,
          status: statusSel.value,
          createdByUid: currentUser.uid,
          createdByLabel: currentUser.email || currentUser.phoneNumber || "عضو",
          createdAt: serverTimestamp()
        });
        input.value = "";
      } catch (err) {
        setStatus(formatError(err, "تعذر إضافة المهمة"));
      }
    });

    document.getElementById("addAdminBtn").addEventListener("click", async () => {
      const emailInput = document.getElementById("adminEmailInput");
      const email = emailInput.value.trim().toLowerCase();
      if (!email || currentRole !== "Owner") return;

      try {
        await setDoc(doc(db, "admins", encodeURIComponent(email)), {
          email,
          role: "Admin",
          updatedAt: serverTimestamp()
        });
        emailInput.value = "";
      } catch (err) {
        setStatus(formatError(err, "تعذر إضافة المشرف"));
      }
    });

    document.getElementById("removeAdminBtn").addEventListener("click", async () => {
      const emailInput = document.getElementById("adminEmailInput");
      const email = emailInput.value.trim().toLowerCase();
      if (!email || currentRole !== "Owner") return;

      try {
        await deleteDoc(doc(db, "admins", encodeURIComponent(email)));
        emailInput.value = "";
      } catch (err) {
        setStatus(formatError(err, "تعذر إزالة المشرف"));
      }
    });

    filterSelect.addEventListener("change", renderTasks);

    if (auth && db) {
      onAuthStateChanged(auth, (user) => {
        currentUser = user;
        if (unsubscribeTasks) { unsubscribeTasks(); unsubscribeTasks = null; }
        if (unsubscribeAdmins) { unsubscribeAdmins(); unsubscribeAdmins = null; }

        if (!user) {
          allTasks = [];
          adminEmails = new Set();
          renderUI();
          return;
        }

        unsubscribeAdmins = onSnapshot(
          collection(db, "admins"),
          (snap) => {
            const nextSet = new Set();
            snap.forEach((d) => {
              const data = d.data();
              if (data && data.email) nextSet.add(String(data.email).toLowerCase());
            });
            adminEmails = nextSet;
            renderUI();
          },
          () => renderUI()
        );

        unsubscribeTasks = onSnapshot(
          query(collection(db, "tasks"), orderBy("createdAt", "desc")),
          (snap) => {
            allTasks = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
            renderTasks();
          },
          (err) => {
            setStatus(formatError(err, "تعذر تحميل المهام — تحقق من قواعد Firestore"));
          }
        );

        renderUI();
      });
    }
  </script>
</body>
</html>
