<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vortex ROV - Task Manager</title>
  <style>
    :root {
      --bg-main: #0b192c;
      --bg-card: #13294b;
      --bg-input: #0e203b;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --border: rgba(148, 163, 184, 0.22);
      --success: #10b981;
      --danger: #ef4444;
      --warn: #f59e0b;
      --info: #38bdf8;
    }

    body.light-theme {
      --bg-main: #f1f5f9;
      --bg-card: #ffffff;
      --bg-input: #f8fafc;
      --text-main: #0f172a;
      --text-muted: #475569;
      --accent: #1d4ed8;
      --accent-hover: #1e40af;
      --border: rgba(15, 23, 42, 0.14);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      padding: 20px;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
    }

    .topbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px 20px;
      margin-bottom: 18px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.2rem;
      font-weight: 700;
    }

    .dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: var(--info);
      display: inline-block;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }

    button, select, input, textarea {
      border-radius: 10px;
      border: 1px solid var(--border);
      font-size: 0.95rem;
      transition: all 0.2s ease;
    }

    button {
      cursor: pointer;
      padding: 9px 14px;
      font-weight: 600;
      background: var(--bg-input);
      color: var(--text-main);
    }

    button:hover {
      border-color: var(--accent);
    }

    .btn-primary {
      background: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
    }

    .btn-primary:hover {
      background: var(--accent-hover);
    }

    .btn-danger {
      background: rgba(239, 68, 68, 0.14);
      color: var(--danger);
      border-color: rgba(239, 68, 68, 0.35);
    }

    .btn-danger:hover {
      background: var(--danger);
      color: #ffffff;
    }

    .btn-success {
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
      border-color: rgba(16, 185, 129, 0.35);
    }

    .btn-success:hover {
      background: var(--success);
      color: #ffffff;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px 20px;
      margin-bottom: 18px;
    }

    .card-title {
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 700;
    }

    .badge-role {
      background: rgba(56, 189, 248, 0.16);
      color: var(--info);
      border: 1px solid rgba(56, 189, 248, 0.35);
    }

    .badge-normal {
      background: rgba(56, 189, 248, 0.15);
      color: var(--info);
    }

    .badge-medium {
      background: rgba(245, 158, 11, 0.18);
      color: var(--warn);
    }

    .badge-serious {
      background: rgba(239, 68, 68, 0.18);
      color: var(--danger);
    }

    .badge-team {
      background: rgba(148, 163, 184, 0.16);
      color: var(--text-main);
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 12px;
    }

    label {
      font-size: 0.88rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    input, select, textarea {
      width: 100%;
      padding: 10px 12px;
      background: var(--bg-input);
      color: var(--text-main);
    }

    textarea {
      min-height: 76px;
      resize: vertical;
    }

    .row-inline {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    .row-inline input {
      flex: 1;
      min-width: 220px;
    }

    .status-msg {
      margin-top: 8px;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .error-msg {
      color: var(--danger);
      font-weight: 600;
      margin-top: 8px;
      font-size: 0.9rem;
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 14px;
    }

    .filters select {
      width: auto;
      min-width: 165px;
    }

    .task-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .task-item {
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .task-item.completed .task-title,
    .task-item.completed .task-desc {
      text-decoration: line-through;
      opacity: 0.65;
    }

    .task-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      flex-wrap: wrap;
    }

    .task-title {
      font-size: 1.05rem;
      font-weight: 700;
    }

    .task-desc {
      color: var(--text-muted);
      font-size: 0.94rem;
      line-height: 1.45;
    }

    .task-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      font-size: 0.84rem;
      color: var(--text-muted);
    }

    .task-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 4px;
    }

    .hidden {
      display: none !important;
    }

    .admin-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 0.85rem;
      margin-top: 8px;
      margin-inline-end: 6px;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Top Bar -->
    <header class="topbar">
      <div class="brand">
        <span class="dot"></span>
        <span id="appTitle">Vortex ROV - إدارة مهام الفريق</span>
      </div>

      <div class="controls">
        <button type="button" id="langToggleBtn">English</button>
        <button type="button" id="themeToggleBtn">☀️ Light</button>
        <button type="button" class="btn-primary" id="loginBtn">الدخول عبر Google</button>
        <button type="button" class="hidden" id="logoutBtn">خروج</button>
      </div>
    </header>

    <!-- Auth & Role Status -->
    <section class="card">
      <div class="card-title">
        <span id="authStatusTitle">حالة النظام</span>
        <span id="roleBadge" class="badge badge-role hidden"></span>
      </div>
      <p id="authStatusText" class="status-msg">الواجهة جاهزة - اضغط الدخول عبر Google</p>
      <p id="globalError" class="error-msg hidden"></p>
    </section>

    <!-- Owner Admin Management -->
    <section id="adminSection" class="card hidden">
      <div class="card-title">
        <span id="adminSectionTitle">إدارة الأدمن (مالك النظام - الحد الأقصى 4)</span>
        <span id="adminCountBadge" class="badge badge-role">0 / 4</span>
      </div>
      <div class="row-inline">
        <input type="email" id="newAdminEmail" placeholder="اكتب بريد Google للأدمن الجديد" />
        <button type="button" class="btn-primary" id="addAdminBtn">إضافة أدمن</button>
      </div>
      <div id="adminsList"></div>
    </section>

    <!-- Add Task Form (Owner / Admin) -->
    <section id="addTaskSection" class="card hidden">
      <div class="card-title">
        <span id="addTaskTitle">إضافة مهمة جديدة للفريق</span>
      </div>

      <div class="grid-2">
        <div class="field">
          <label for="taskNameInput" id="lblTaskName">المهمة هي إيه (العنوان)</label>
          <input type="text" id="taskNameInput" placeholder="مثال: اختبار حساسات العمق" />
        </div>

        <div class="field">
          <label for="taskTeamSelect" id="lblTaskTeam">المهمة تبع تيم إيه</label>
          <select id="taskTeamSelect">
            <option value="Mechanical">Mechanical</option>
            <option value="Electrical">Electrical</option>
            <option value="Vision">Vision</option>
            <option value="Control">Control</option>
            <option value="GUI">GUI</option>
          </select>
        </div>

        <div class="field">
          <label for="taskPrioritySelect" id="lblTaskPriority">أهمية / جدية المهمة</label>
          <select id="taskPrioritySelect">
            <option value="normal">عادية (Normal)</option>
            <option value="medium">متوسطة (Medium)</option>
            <option value="serious">جدية (Serious)</option>
          </select>
        </div>

        <div class="field">
          <label for="taskAssigneeInput" id="lblTaskAssignee">المسؤول عن المهمة (اختياري)</label>
          <input type="text" id="taskAssigneeInput" placeholder="اختياري: اسم أو بريد المسؤول" />
        </div>
      </div>

      <div class="field">
        <label for="taskDescInput" id="lblTaskDesc">المهمة عبارة عن إيه (التفاصيل)</label>
        <textarea id="taskDescInput" placeholder="اكتب تفاصيل المهمة والخطوات المطلوبة..."></textarea>
      </div>

      <button type="button" class="btn-primary" id="addTaskBtn">إضافة مهمة</button>
    </section>

    <!-- Tasks List & Filters -->
    <section class="card">
      <div class="card-title">
        <span id="tasksSectionTitle">مهام الفريق</span>
      </div>

      <div id="filtersBar" class="filters hidden">
        <select id="filterTeam">
          <option value="ALL">كل التيمات (All Teams)</option>
          <option value="Mechanical">Mechanical</option>
          <option value="Electrical">Electrical</option>
          <option value="Vision">Vision</option>
          <option value="Control">Control</option>
          <option value="GUI">GUI</option>
        </select>

        <select id="filterPriority">
          <option value="ALL">كل الأولويات (All Priorities)</option>
          <option value="normal">عادية (Normal)</option>
          <option value="medium">متوسطة (Medium)</option>
          <option value="serious">جدية (Serious)</option>
        </select>

        <select id="filterStatus">
          <option value="ALL">الكل (All)</option>
          <option value="pending">قيد التنفيذ (Pending)</option>
          <option value="completed">مكتملة (Completed)</option>
        </select>
      </div>

      <div id="tasksContainer" class="task-list">
        <p id="emptyTasksMsg" class="status-msg">سجّل دخولك لعرض المهام وتحديث حالتها.</p>
      </div>
    </section>
  </div>

  <!-- Firebase SDK (v10 Modular) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getAuth,
      GoogleAuthProvider,
      signInWithPopup,
      signOut,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import {
      getFirestore,
      doc,
      getDoc,
      setDoc,
      updateDoc,
      deleteDoc,
      collection,
      addDoc,
      onSnapshot,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA_REPLACE_WITH_YOUR_API_KEY_IF_NEEDED",
      authDomain: "vortex-rov.firebaseapp.com",
      projectId: "vortex-rov",
      storageBucket: "vortex-rov.appspot.com",
      messagingSenderId: "764552928966",
      appId: "1:764552928966:web:REPLACE_WITH_YOUR_APP_ID_IF_NEEDED"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    const i18n = {
      ar: {
        appTitle: "Vortex ROV - إدارة مهام الفريق",
        langBtn: "English",
        themeLight: "☀️ Light",
        themeDark: "🌙 Dark",
        login: "الدخول عبر Google",
        logout: "خروج",
        authTitle: "حالة النظام",
        signedOutMsg: "الواجهة جاهزة - اضغط الدخول عبر Google",
        signedInMsg: (email, role) => `مسجّل الدخول: ${email} — الصلاحية: ${role}`,
        adminTitle: "إدارة الأدمن (مالك النظام - الحد الأقصى 4)",
        adminPlaceholder: "اكتب بريد Google للأدمن الجديد",
        addAdmin: "إضافة أدمن",
        addTaskTitle: "إضافة مهمة جديدة للفريق",
        lblTaskName: "المهمة هي إيه (العنوان)",
        taskNamePh: "مثال: اختبار حساسات العمق",
        lblTaskTeam: "المهمة تبع تيم إيه",
        lblTaskPriority: "أهمية / جدية المهمة",
        lblTaskAssignee: "المسؤول عن المهمة (اختياري)",
        taskAssigneePh: "اختياري: اسم أو بريد المسؤول",
        lblTaskDesc: "المهمة عبارة عن إيه (التفاصيل)",
        taskDescPh: "اكتب تفاصيل المهمة والخطوات المطلوبة...",
        addTask: "إضافة مهمة",
        tasksTitle: "مهام الفريق",
        loginToView: "سجّل دخولك لعرض المهام وتحديث حالتها.",
        noTasks: "لا توجد مهام مطابقة حالياً.",
        doneBtn: "✔ تم الإنجاز",
        undoBtn: "↩ إلغاء الإنجاز",
        deleteBtn: "🗑 حذف المهمة",
        completedTag: "مكتملة",
        pendingTag: "قيد التنفيذ",
        assigneePrefix: "المسؤول:",
        unassigned: "غير محدد (اختياري)",
        priorityMap: { normal: "عادية", medium: "متوسطة", serious: "جدية" },
        allTeams: "كل التيمات",
        allPriorities: "كل الأولويات",
        allStatus: "الكل",
        pendingFilter: "قيد التنفيذ",
        completedFilter: "مكتملة",
        maxAdminsErr: "الحد الأقصى للأدمن هو 4 فقط.",
        invalidEmailErr: "اكتب بريد إلكتروني صحيح.",
        taskRequiredErr: "اكتب اسم المهمة أولاً."
      },
      en: {
        appTitle: "Vortex ROV - Team Task Manager",
        langBtn: "العربية",
        themeLight: "☀️ Light",
        themeDark: "🌙 Dark",
        login: "Sign in with Google",
        logout: "Sign out",
        authTitle: "System Status",
        signedOutMsg: "Interface ready - Click Sign in with Google",
        signedInMsg: (email, role) => `Signed in: ${email} — Role: ${role}`,
        adminTitle: "Admin Management (Owner - Max 4)",
        adminPlaceholder: "Enter new admin Google email",
        addAdmin: "Add Admin",
        addTaskTitle: "Add New Team Task",
        lblTaskName: "What is the task? (Title)",
        taskNamePh: "e.g. Test depth sensors",
        lblTaskTeam: "Team",
        lblTaskPriority: "Priority Level",
        lblTaskAssignee: "Assignee (Optional)",
        taskAssigneePh: "Optional: name or email",
        lblTaskDesc: "What is it about? (Details)",
        taskDescPh: "Write task details and steps...",
        addTask: "Add Task",
        tasksTitle: "Team Tasks",
        loginToView: "Sign in to view and update tasks.",
        noTasks: "No matching tasks found.",
        doneBtn: "✔ Mark Completed",
        undoBtn: "↩ Undo Complete",
        deleteBtn: "🗑 Delete Task",
        completedTag: "Completed",
        pendingTag: "In Progress",
        assigneePrefix: "Assignee:",
        unassigned: "Unassigned (Optional)",
        priorityMap: { normal: "Normal", medium: "Medium", serious: "Serious" },
        allTeams: "All Teams",
        allPriorities: "All Priorities",
        allStatus: "All Status",
        pendingFilter: "Pending",
        completedFilter: "Completed",
        maxAdminsErr: "Maximum limit is 4 admins.",
        invalidEmailErr: "Please enter a valid email address.",
        taskRequiredErr: "Please enter a task title."
      }
    };

    let currentLang = localStorage.getItem("vortex_lang") || "ar";
    let currentTheme = localStorage.getItem("vortex_theme") || "dark";
    let currentUser = null;
    let currentRole = "Member";
    let adminsList = [];
    let allTasks = [];
    let unsubscribeTasks = null;
    let unsubscribeConfig = null;

    const el = (id) => document.getElementById(id);

    function showError(msg) {
      const box = el("globalError");
      if (!msg) {
        box.textContent = "";
        box.classList.add("hidden");
      } else {
        box.textContent = msg;
        box.classList.remove("hidden");
      }
    }

    function applyTheme() {
      document.body.classList.toggle("light-theme", currentTheme === "light");
      el("themeToggleBtn").textContent = currentTheme === "light" ? i18n[currentLang].themeDark : i18n[currentLang].themeLight;
      localStorage.setItem("vortex_theme", currentTheme);
    }

    function applyLanguage() {
      const t = i18n[currentLang];
      document.documentElement.lang = currentLang;
      document.documentElement.dir = currentLang === "ar" ? "rtl" : "ltr";

      el("appTitle").textContent = t.appTitle;
      el("langToggleBtn").textContent = t.langBtn;
      el("loginBtn").textContent = t.login;
      el("logoutBtn").textContent = t.logout;
      el("authStatusTitle").textContent = t.authTitle;
      el("adminSectionTitle").textContent = t.adminTitle;
      el("newAdminEmail").placeholder = t.adminPlaceholder;
      el("addAdminBtn").textContent = t.addAdmin;
      el("addTaskTitle").textContent = t.addTaskTitle;
      el("lblTaskName").textContent = t.lblTaskName;
      el("taskNameInput").placeholder = t.taskNamePh;
      el("lblTaskTeam").textContent = t.lblTaskTeam;
      el("lblTaskPriority").textContent = t.lblTaskPriority;
      el("lblTaskAssignee").textContent = t.lblTaskAssignee;
      el("taskAssigneeInput").placeholder = t.taskAssigneePh;
      el("lblTaskDesc").textContent = t.lblTaskDesc;
      el("taskDescInput").placeholder = t.taskDescPh;
      el("addTaskBtn").textContent = t.addTask;
      el("tasksSectionTitle").textContent = t.tasksTitle;

      el("filterTeam").options[0].textContent = t.allTeams;
      el("filterPriority").options[0].textContent = t.allPriorities;
      el("filterPriority").options[1].textContent = t.priorityMap.normal;
      el("filterPriority").options[2].textContent = t.priorityMap.medium;
      el("filterPriority").options[3].textContent = t.priorityMap.serious;
      el("filterStatus").options[0].textContent = t.allStatus;
      el("filterStatus").options[1].textContent = t.pendingFilter;
      el("filterStatus").options[2].textContent = t.completedFilter;

      el("taskPrioritySelect").options[0].textContent = t.priorityMap.normal;
      el("taskPrioritySelect").options[1].textContent = t.priorityMap.medium;
      el("taskPrioritySelect").options[2].textContent = t.priorityMap.serious;

      applyTheme();
      updateAuthUI();
      renderAdmins();
      renderTasks();
    }

    function updateAuthUI() {
      const t = i18n[currentLang];
      if (!currentUser) {
        el("loginBtn").classList.remove("hidden");
        el("logoutBtn").classList.add("hidden");
        el("roleBadge").classList.add("hidden");
        el("adminSection").classList.add("hidden");
        el("addTaskSection").classList.add("hidden");
        el("filtersBar").classList.add("hidden");
        el("authStatusText").textContent = t.signedOutMsg;
        el("tasksContainer").innerHTML = `<p class="status-msg">${t.loginToView}</p>`;
        return;
      }

      el("loginBtn").classList.add("hidden");
      el("logoutBtn").classList.remove("hidden");
      el("roleBadge").classList.remove("hidden");
      el("roleBadge").textContent = currentRole;
      el("authStatusText").textContent = t.signedInMsg(currentUser.email, currentRole);
      el("filtersBar").classList.remove("hidden");

      const canAddTask = currentRole === "Owner" || currentRole === "Admin";
      el("addTaskSection").classList.toggle("hidden", !canAddTask);
      el("adminSection").classList.toggle("hidden", currentRole !== "Owner");
    }

    function renderAdmins() {
      el("adminCountBadge").textContent = `${adminsList.length} / 4`;
      el("adminsList").innerHTML = adminsList
        .map((email) => `<span class="admin-chip">🛡️ ${email}</span>`)
        .join("");
    }

    function getPriorityBadgeClass(priority) {
      if (priority === "serious") return "badge-serious";
      if (priority === "medium") return "badge-medium";
      return "badge-normal";
    }

    function renderTasks() {
      if (!currentUser) return;
      const t = i18n[currentLang];
      const teamVal = el("filterTeam").value;
      const prioVal = el("filterPriority").value;
      const statusVal = el("filterStatus").value;

      const filtered = allTasks.filter((task) => {
        if (teamVal !== "ALL" && task.team !== teamVal) return false;
        if (prioVal !== "ALL" && task.priority !== prioVal) return false;
        if (statusVal === "completed" && !task.completed) return false;
        if (statusVal === "pending" && task.completed) return false;
        return true;
      });

      if (filtered.length === 0) {
        el("tasksContainer").innerHTML = `<p class="status-msg">${t.noTasks}</p>`;
        return;
      }

      el("tasksContainer").innerHTML = filtered
        .map((task) => {
          const prioLabel = t.priorityMap[task.priority] || t.priorityMap.normal;
          const statusLabel = task.completed ? t.completedTag : t.pendingTag;
          const assigneeText = task.assignee && task.assignee.trim()
            ? `${t.assigneePrefix} ${task.assignee.trim()}`
            : t.unassigned;

          const toggleBtnText = task.completed ? t.undoBtn : t.doneBtn;
          const deleteBtnHtml = currentRole === "Owner"
            ? `<button type="button" class="btn-danger" data-action="delete" data-id="${task.id}">${t.deleteBtn}</button>`
            : "";

          return `
            <div class="task-item ${task.completed ? "completed" : ""}">
              <div class="task-header">
                <div class="task-title">${escapeHtml(task.title)}</div>
                <div class="row-inline">
                  <span class="badge badge-team">${escapeHtml(task.team || "Mechanical")}</span>
                  <span class="badge ${getPriorityBadgeClass(task.priority)}">${prioLabel}</span>
                  <span class="badge badge-role">${statusLabel}</span>
                </div>
              </div>
              ${task.description ? `<p class="task-desc">${escapeHtml(task.description)}</p>` : ""}
              <div class="task-meta">
                <span>👤 ${escapeHtml(assigneeText)}</span>
              </div>
              <div class="task-actions">
                <button type="button" class="btn-success" data-action="toggle" data-id="${task.id}" data-completed="${!task.completed}">${toggleBtnText}</button>
                ${deleteBtnHtml}
              </div>
            </div>
          `;
        })
        .join("");
    }

    function escapeHtml(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    async function resolveRoleAndListeners(user) {
      showError("");
      const configRef = doc(db, "config", "roles");

      if (unsubscribeConfig) unsubscribeConfig();
      if (unsubscribeTasks) unsubscribeTasks();

      let snap = await getDoc(configRef);
      if (!snap.exists()) {
        await setDoc(configRef, {
          ownerEmail: user.email.toLowerCase(),
          admins: []
        });
        snap = await getDoc(configRef);
      }

      unsubscribeConfig = onSnapshot(configRef, (docSnap) => {
        const data = docSnap.data() || {};
        const ownerEmail = (data.ownerEmail || "").toLowerCase();
        adminsList = Array.isArray(data.admins) ? data.admins : [];

        const emailLower = (user.email || "").toLowerCase();
        if (emailLower === ownerEmail) {
          currentRole = "Owner";
        } else if (adminsList.map((e) => e.toLowerCase()).includes(emailLower)) {
          currentRole = "Admin";
        } else {
          currentRole = "Member";
        }

        updateAuthUI();
        renderAdmins();
        renderTasks();
      }, (err) => showError(err.message));

      const tasksRef = collection(db, "tasks");
      unsubscribeTasks = onSnapshot(tasksRef, (querySnap) => {
        allTasks = querySnap.docs.map((d) => ({ id: d.id, ...d.data() }));
        allTasks.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
        renderTasks();
      }, (err) => showError(err.message));
    }

    el("langToggleBtn").addEventListener("click", () => {
      currentLang = currentLang === "ar" ? "en" : "ar";
      localStorage.setItem("vortex_lang", currentLang);
      applyLanguage();
    });

    el("themeToggleBtn").addEventListener("click", () => {
      currentTheme = currentTheme === "dark" ? "light" : "dark";
      applyTheme();
    });

    el("loginBtn").addEventListener("click", async () => {
      showError("");
      try {
        await signInWithPopup(auth, provider);
      } catch (err) {
        showError(err.message);
      }
    });

    el("logoutBtn").addEventListener("click", async () => {
      showError("");
      await signOut(auth);
    });

    el("addAdminBtn").addEventListener("click", async () => {
      showError("");
      if (currentRole !== "Owner") return;
      const emailVal = el("newAdminEmail").value.trim().toLowerCase();
      if (!emailVal || !emailVal.includes("@")) {
        showError(i18n[currentLang].invalidEmailErr);
        return;
      }
      if (adminsList.length >= 4) {
        showError(i18n[currentLang].maxAdminsErr);
        return;
      }
      if (!adminsList.includes(emailVal)) {
        const updated = [...adminsList, emailVal];
        await updateDoc(doc(db, "config", "roles"), { admins: updated });
      }
      el("newAdminEmail").value = "";
    });

    el("addTaskBtn").addEventListener("click", async () => {
      showError("");
      const title = el("taskNameInput").value.trim();
      if (!title) {
        showError(i18n[currentLang].taskRequiredErr);
        return;
      }
      const team = el("taskTeamSelect").value;
      const priority = el("taskPrioritySelect").value;
      const assignee = el("taskAssigneeInput").value.trim();
      const description = el("taskDescInput").value.trim();

      try {
        await addDoc(collection(db, "tasks"), {
          title,
          team,
          priority,
          assignee,
          description,
          completed: false,
          createdBy: currentUser.email,
          createdAt: serverTimestamp()
        });

        el("taskNameInput").value = "";
        el("taskAssigneeInput").value = "";
        el("taskDescInput").value = "";
      } catch (err) {
        showError(err.message);
      }
    });

    el("tasksContainer").addEventListener("click", async (e) => {
      const btn = e.target.closest("button[data-action]");
      if (!btn) return;
      const action = btn.dataset.action;
      const id = btn.dataset.id;

      try {
        if (action === "toggle") {
          const nextCompleted = btn.dataset.completed === "true";
          await updateDoc(doc(db, "tasks", id), { completed: nextCompleted });
        } else if (action === "delete" && currentRole === "Owner") {
          await deleteDoc(doc(db, "tasks", id));
        }
      } catch (err) {
        showError(err.message);
      }
    });

    el("filterTeam").addEventListener("change", renderTasks);
    el("filterPriority").addEventListener("change", renderTasks);
    el("filterStatus").addEventListener("change", renderTasks);

    onAuthStateChanged(auth, async (user) => {
      currentUser = user;
      if (user) {
        await resolveRoleAndListeners(user);
      } else {
        currentRole = "Member";
        adminsList = [];
        allTasks = [];
        if (unsubscribeConfig) unsubscribeConfig();
        if (unsubscribeTasks) unsubscribeTasks();
        updateAuthUI();
      }
    });

    applyLanguage();
  </script>
</body>
</html>
